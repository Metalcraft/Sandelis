<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0969da">
<title>Prisijungimas – Sandelio Sistema</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #0d1117;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .wrap {
    width: 100%;
    max-width: 380px;
  }

  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .logo-ico {
    width: 44px;
    height: 44px;
    background: #0969da;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-ico::after {
    content: '';
    display: block;
    width: 20px;
    height: 20px;
    border: 3px solid #fff;
    border-radius: 3px;
  }

  .logo-txt {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 2px;
  }

  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 32px;
  }

  .card-title {
    font-size: 18px;
    font-weight: 700;
    color: #e6edf3;
    margin-bottom: 6px;
    text-align: center;
  }

  .card-sub {
    font-size: 13px;
    color: #8b949e;
    text-align: center;
    margin-bottom: 28px;
  }

  .fl {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #8b949e;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .inp {
    width: 100%;
    padding: 11px 14px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }

  .inp:focus { border-color: #0969da; }

  .inp-wrap { margin-bottom: 18px; position: relative; }

  .inp-wrap .eye {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #8b949e;
    font-size: 16px;
    user-select: none;
  }

  .inp-wrap .eye:hover { color: #e6edf3; }

  .btn-login {
    width: 100%;
    padding: 12px;
    background: #0969da;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s, transform .1s;
    margin-top: 4px;
  }

  .btn-login:hover { background: #0860ca; }
  .btn-login:active { transform: scale(.98); }
  .btn-login:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; transform: none; }

  .err {
    display: none;
    background: rgba(248,81,73,.12);
    border: 1px solid rgba(248,81,73,.4);
    color: #f85149;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
    text-align: center;
  }

  .err.show { display: block; }

  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #484f58;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo-row">
    <div class="logo-ico"></div>
    <div class="logo-txt">SANDELIS</div>
  </div>

  <div class="card">
    <div class="card-title">Prisijungimas</div>
    <div class="card-sub">Įveskite slaptažodį norėdami tęsti</div>

    <div class="err" id="errMsg">Neteisingas slaptažodis</div>

    <div class="inp-wrap">
      <label class="fl" for="passInp">Slaptažodis</label>
      <input class="inp" type="password" id="passInp" placeholder="••••••••" autocomplete="current-password">
      <span class="eye" id="eyeBtn" onclick="togglePass()">👁</span>
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">Prisijungti</button>
  </div>

  <div class="footer">Metalcraft &copy; Sandelio Sistema</div>
</div>

<script>
  // Enter key support
  document.getElementById('passInp').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  // Auto-focus
  document.getElementById('passInp').focus();

  function togglePass() {
    const inp = document.getElementById('passInp');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  async function doLogin() {
    const slaptazodis = document.getElementById('passInp').value;
    if (!slaptazodis) return;

    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errMsg');
    btn.disabled = true;
    btn.textContent = 'Jungiamasi...';
    err.classList.remove('show');

    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slaptazodis })
      });
      const d = await r.json();

      if (d.token) {
        // Išsaugoti token cookie
        const expires = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toUTCString();
        document.cookie = 'stoken=' + d.token + ';expires=' + expires + ';path=/';
        localStorage.setItem('srole', d.role || 'admin');
        localStorage.setItem('svardas', d.vardas || 'Admin');
        window.location.href = '/';
      } else {
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Prisijungti';
        document.getElementById('passInp').select();
      }
    } catch (e) {
      err.textContent = 'Serverio klaida. Bandykite dar kartą.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Prisijungti';
    }
  }
</script>
</body>
</html>
